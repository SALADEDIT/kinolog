spring:
  datasource:
    username: kin_admin
    password: kin_pass
    url: jdbc:postgresql://localhost:5476/kinolog
#    url: jdbc:postgresql://db:5432/kinolog-db
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true

  docker:
    compose:
      enabled: false
      profiles:
        active: dev
      lifecycle-management: START_AND_STOP


management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
  prometheus:
    metrics:
      export:
        enabled: true